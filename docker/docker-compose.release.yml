services:
  antigravity-manager:
    image: ghcr.io/echo7659/antigravity-manager-lee:latest
    container_name: antigravity-manager
    restart: unless-stopped
    ports:
      - "8045:8045"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env}
      ABV_BIND_LOCAL_ONLY: "false"
      ABV_HEALTH_WATCHDOG_ENABLED: ${ABV_HEALTH_WATCHDOG_ENABLED:-true}
      ABV_PROXY_HEALTH_BATCH_SIZE: ${ABV_PROXY_HEALTH_BATCH_SIZE:-25}
      ABV_PROXY_HEALTH_CONCURRENCY: ${ABV_PROXY_HEALTH_CONCURRENCY:-5}
      ABV_PROXY_HEALTH_START_DELAY_SECS: ${ABV_PROXY_HEALTH_START_DELAY_SECS:-60}
    volumes:
      - ./data:/root/.antigravity_tools
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
