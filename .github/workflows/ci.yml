name: Test, Publish Image and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Compatibility regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned compiler required by yaml-rt
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare tests from current source
        run: python3 scripts/prepare_compat_tests.py "$RUNNER_TEMP/compat-tests"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/compat-tests/target
          key: compat-${{ runner.os }}-${{ hashFiles('tests/compat/Cargo.lock') }}
      - name: Test request normalization
        run: cargo test --locked --manifest-path "$RUNNER_TEMP/compat-tests/Cargo.toml" --lib request_compat
      - name: Test usage, streams and account failover
        run: cargo test --locked --manifest-path "$RUNNER_TEMP/compat-tests/Cargo.toml" --lib compat_

      - name: Test upstream usage conversion
        run: cargo test --locked --manifest-path "$RUNNER_TEMP/compat-tests/Cargo.toml" --lib proxy::pipeline

  publish:
    name: Build, smoke-test and publish linux/amd64 image
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release_meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release metadata
        id: release_meta
        run: python3 scripts/release_metadata.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.release_meta.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
      - name: Build and load image for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.compat
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ steps.release_meta.outputs.local_image }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USE_MIRROR=false
            BUILD_JOBS=2
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=lee-amd64
      - name: Validate container HTTP endpoints
        env:
          LOCAL_IMAGE: ${{ steps.release_meta.outputs.local_image }}
          BASE_VERSION: ${{ steps.release_meta.outputs.base_version }}
        run: |
          docker run -d --name antigravity-ci-smoke -p 127.0.0.1:18045:8045 -e API_KEY=ci-smoke-only -e WEB_PASSWORD=ci-smoke-only -e ABV_BIND_LOCAL_ONLY=false "$LOCAL_IMAGE"
          python3 scripts/ci_smoke.py --version "$BASE_VERSION"
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.compat
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USE_MIRROR=false
            BUILD_JOBS=2
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=lee-amd64
          cache-to: type=gha,scope=lee-amd64,mode=max
      - name: Record image digest
        env:
          IMAGE_NAME: ${{ steps.release_meta.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove smoke container
        if: always()
        run: docker rm -f antigravity-ci-smoke >/dev/null 2>&1 || true

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create versioned deployment assets
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_NAME: ${{ needs.publish.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/build_release_assets.py
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_DIR"/*.tar.gz "$RELEASE_DIR/image-manifest.json" "$RELEASE_DIR/SHA256SUMS" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_DIR/RELEASE_NOTES.md"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_DIR"/*.tar.gz "$RELEASE_DIR/image-manifest.json" "$RELEASE_DIR/SHA256SUMS" --title "Antigravity Manager Lee $RELEASE_TAG" --notes-file "$RELEASE_DIR/RELEASE_NOTES.md" --verify-tag --latest
          fi
